<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="MedKit logo">
  <defs>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0F0F"/>
      <stop offset="100%" stop-color="#0D1A13"/>
    </linearGradient>

    <!-- Box body gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3535"/>
      <stop offset="100%" stop-color="#562C2C"/>
    </linearGradient>

    <!-- Cross gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DFBB"/>
      <stop offset="100%" stop-color="#E8C98A"/>
    </linearGradient>

    <!-- Pixel glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle outer glow for the box -->
    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#562C2C" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>

    <!-- Scan line pattern -->
    <pattern id="scanlines" x="0" y="0" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="rgba(0,0,0,0.15)"/>
    </pattern>

    <!-- Corner dot pattern -->
    <pattern id="dotgrid" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="rgba(78,110,93,0.25)"/>
    </pattern>

  </defs>

  <!-- ── Background ── -->
  <rect width="480" height="160" fill="url(#bgGrad)" rx="8"/>
  <rect width="480" height="160" fill="url(#dotgrid)" rx="8" opacity="0.8"/>
  <rect width="480" height="160" fill="url(#scanlines)" rx="8"/>

  <!-- ── Decorative circuit lines (left) ── -->
  <g opacity="0.20" stroke="#4E6E5D" stroke-width="1" fill="none">
    <polyline points="20,30 36,30 36,52"/>
    <polyline points="20,130 36,130 36,108"/>
    <circle cx="36" cy="52" r="2" fill="#4E6E5D" stroke="none"/>
    <circle cx="36" cy="108" r="2" fill="#4E6E5D" stroke="none"/>
    <line x1="20" y1="80" x2="28" y2="80"/>
    <circle cx="28" cy="80" r="2" fill="#4E6E5D" stroke="none"/>
  </g>

  <!-- ── Decorative circuit lines (right) ── -->
  <g opacity="0.20" stroke="#4E6E5D" stroke-width="1" fill="none">
    <polyline points="460,30 444,30 444,52"/>
    <polyline points="460,130 444,130 444,108"/>
    <circle cx="444" cy="52" r="2" fill="#4E6E5D" stroke="none"/>
    <circle cx="444" cy="108" r="2" fill="#4E6E5D" stroke="none"/>
    <line x1="460" y1="80" x2="452" y2="80"/>
    <circle cx="452" cy="80" r="2" fill="#4E6E5D" stroke="none"/>
  </g>

  <!-- ── Pixel sparkles (top-left area) ── -->
  <g fill="#F5DFBB" opacity="0.35">
    <rect x="52" y="22" width="3" height="3"/>
    <rect x="60" y="18" width="2" height="2"/>
    <rect x="56" y="28" width="2" height="2"/>
  </g>
  <g fill="#4E6E5D" opacity="0.45">
    <rect x="390" y="130" width="3" height="3"/>
    <rect x="396" y="126" width="2" height="2"/>
    <rect x="384" y="134" width="2" height="2"/>
  </g>

  <!-- ════════════════════════════════════
       ICON — The MedKit Box
       ════════════════════════════════════ -->

  <!-- Shadow layer -->
  <rect x="62" y="52" width="76" height="62" rx="5" fill="rgba(0,0,0,0.4)"/>

  <!-- Main box body -->
  <rect x="58" y="46" width="76" height="62" rx="5" fill="url(#boxGrad)" filter="url(#boxGlow)"/>

  <!-- Box lid top highlight -->
  <rect x="58" y="46" width="76" height="14" rx="5" fill="#6B3535"/>
  <rect x="58" y="54" width="76" height="6" fill="#6B3535"/>

  <!-- Box lid line -->
  <line x1="58" y1="60" x2="134" y2="60" stroke="#3D1F1F" stroke-width="1.5"/>

  <!-- Latch -->
  <rect x="82" y="56" width="28" height="8" rx="2" fill="#3D1F1F"/>
  <rect x="86" y="58" width="20" height="4" rx="1" fill="#F5DFBB" opacity="0.5"/>

  <!-- Handle notch on lid -->
  <rect x="76" y="43" width="40" height="8" rx="4" fill="#3D1F1F"/>
  <rect x="80" y="44" width="32" height="6" rx="3" fill="#562C2C"/>

  <!-- Cross — horizontal bar -->
  <rect x="73" y="72" width="46" height="16" rx="2" fill="url(#crossGrad)" filter="url(#glow)"/>
  <!-- Cross — vertical bar -->
  <rect x="89" y="62" width="14" height="36" rx="2" fill="url(#crossGrad)" filter="url(#glow)"/>

  <!-- Cross inner pixel detail (video-game style inner light) -->
  <rect x="77" y="76" width="6" height="8" rx="1" fill="rgba(255,255,255,0.18)"/>
  <rect x="109" y="76" width="6" height="8" rx="1" fill="rgba(255,255,255,0.10)"/>

  <!-- Pixel bits on corners of box (game-style screws) -->
  <rect x="62" y="65" width="4" height="4" rx="1" fill="#3D1F1F" opacity="0.7"/>
  <rect x="126" y="65" width="4" height="4" rx="1" fill="#3D1F1F" opacity="0.7"/>
  <rect x="62" y="100" width="4" height="4" rx="1" fill="#3D1F1F" opacity="0.7"/>
  <rect x="126" y="100" width="4" height="4" rx="1" fill="#3D1F1F" opacity="0.7"/>

  <!-- Small pixel blink on box (game-UI indicator light) -->
  <rect x="122" y="48" width="5" height="5" rx="1" fill="#4E6E5D" opacity="0.9"/>
  <rect x="123" y="49" width="3" height="3" rx="0.5" fill="#A8D4B8" opacity="0.7"/>

  <!-- ════════════════════════════════════
       WORDMARK
       ════════════════════════════════════ -->

  <!-- med — claret-ish warm tone -->
  <text
    x="156"
    y="95"
    font-family="'Courier New', Courier, monospace"
    font-size="52"
    font-weight="700"
    letter-spacing="-1"
    fill="#F5DFBB"
  >med</text>

  <!-- kit — sage accent -->
  <text
    x="284"
    y="95"
    font-family="'Courier New', Courier, monospace"
    font-size="52"
    font-weight="700"
    letter-spacing="-1"
    fill="#4E6E5D"
  >kit</text>

  <!-- Underscore blink cursor (game terminal feel) -->
  <rect x="358" y="78" width="14" height="6" rx="1" fill="#4E6E5D" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Tagline ── -->
  <text
    x="157"
    y="118"
    font-family="'Courier New', Courier, monospace"
    font-size="10"
    letter-spacing="0.22em"
    fill="#4E6E5D"
    opacity="0.8"
  >HEALTH · PROFESSIONALS · SYSTEM</text>

  <!-- ── Top accent line ── -->
  <line x1="157" y1="48" x2="380" y2="48" stroke="#562C2C" stroke-width="1" opacity="0.5"/>

  <!-- Small pixel ornament on the line -->
  <rect x="157" y="44" width="4" height="4" fill="#562C2C" opacity="0.8"/>
  <rect x="376" y="44" width="4" height="4" fill="#4E6E5D" opacity="0.8"/>

</svg>
